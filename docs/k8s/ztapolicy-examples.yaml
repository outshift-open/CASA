---
# Example 1: Agent ZTA Policy with MCP and A2A access
apiVersion: zta.io/v1alpha1
kind: ZTAPolicy
metadata:
  name: agent-policy
  namespace: production-mas
spec:
  targetRef:
    kind: Deployment
    name: orchestrator-agent
  allowedProtocols:
  - mcp
  - a2a
  allowedEndpoints:
  - name: filesystem-mcp
    namespace: production-mas
    port: 8080
  - name: database-mcp
    namespace: production-mas
    port: 8080
  - name: zta-auth-service
    namespace: zta-control-plane
    port: 8443
  - name: other-agent
    namespace: production-mas
    port: 8000
  llmEndpoint:
    fqdn: api.openai.com
    port: 443

---
# Example 2: MCP Server Policy (only receives MCP protocol)
apiVersion: zta.io/v1alpha1
kind: ZTAPolicy
metadata:
  name: mcp-server-policy
  namespace: production-mas
spec:
  targetRef:
    kind: Deployment
    name: filesystem-mcp
  allowedProtocols:
  - mcp
  allowedEndpoints:
  - name: zta-auth-service
    namespace: zta-control-plane
    port: 8443

---
# Example 3: Client Application Policy (can only use MCP)
apiVersion: zta.io/v1alpha1
kind: ZTAPolicy
metadata:
  name: client-policy
  namespace: production-mas
spec:
  targetRef:
    kind: Deployment
    name: user-app
  allowedProtocols:
  - mcp
  allowedEndpoints:
  - name: orchestrator-agent
    namespace: production-mas
    port: 8000
  - name: zta-auth-service
    namespace: zta-control-plane
    port: 8443

---
# Example 4: Restricted Agent (no LLM access)
apiVersion: zta.io/v1alpha1
kind: ZTAPolicy
metadata:
  name: restricted-agent-policy
  namespace: production-mas
spec:
  targetRef:
    kind: StatefulSet
    name: worker-agent
  allowedProtocols:
  - mcp
  allowedEndpoints:
  - name: filesystem-mcp
    namespace: production-mas
    port: 8080
  - name: zta-auth-service
    namespace: zta-control-plane
    port: 8443
  # Note: No llmEndpoint configured - this agent cannot access external LLMs
