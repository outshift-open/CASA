apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ztapolicies.zta.io
spec:
  group: zta.io
  names:
    kind: ZTAPolicy
    plural: ztapolicies
    singular: ztapolicy
    shortNames:
    - ztap
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
            properties:
              name:
                type: string
              namespace:
                type: string
          spec:
            type: object
            required:
            - targetRef
            properties:
              targetRef:
                type: object
                description: "Reference to the workload this policy applies to"
                required:
                - kind
                - name
                properties:
                  kind:
                    type: string
                    description: "Kubernetes workload kind"
                    enum: [Deployment, StatefulSet, Pod]
                  name:
                    type: string
                    description: "Name of the workload"
              allowedProtocols:
                type: array
                description: "List of allowed communication protocols"
                items:
                  type: string
                  enum: [mcp, a2a, http]
              allowedEndpoints:
                type: array
                description: "List of endpoints this workload can communicate with"
                items:
                  type: object
                  required:
                  - name
                  - namespace
                  - port
                  properties:
                    name:
                      type: string
                      description: "Name of the target service"
                    namespace:
                      type: string
                      description: "Namespace of the target service"
                    port:
                      type: integer
                      description: "Port number"
              llmEndpoint:
                type: object
                description: "External LLM endpoint configuration (if allowed)"
                properties:
                  fqdn:
                    type: string
                    description: "Fully qualified domain name of the LLM service"
                  port:
                    type: integer
                    description: "Port number for LLM service"
          status:
            type: object
            properties:
              phase:
                type: string
                description: "Current phase of the policy"
                enum: [Pending, Active, Failed]
              ciliumPolicyName:
                type: string
                description: "Name of the generated CiliumNetworkPolicy"
              lastSyncTime:
                type: string
                format: date-time
                description: "Timestamp of last successful reconciliation"
              message:
                type: string
                description: "Human-readable status message"
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: Target
      type: string
      jsonPath: .spec.targetRef.name
    - name: Cilium Policy
      type: string
      jsonPath: .status.ciliumPolicyName
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
