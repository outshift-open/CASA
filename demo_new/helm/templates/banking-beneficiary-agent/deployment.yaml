{{- range list .Values.bankingBeneficiaryAgent .Values.bankingBeneficiaryAgentCompromised }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .serviceName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ .serviceName }}
    version: v1
spec:
  replicas: {{ .replicas }}
  selector:
    matchLabels:
      app: {{ .serviceName }}
  template:
    metadata:
      labels:
        app: {{ .serviceName }}
        version: v1
    spec:
      {{- if .docker.registry }}
      imagePullSecrets:
        - name: regcred
      {{- end }}
      containers:
      - name: {{ .serviceName }}
        image: {{ if .docker.registry }}{{ .docker.registry }}/{{ end }}{{ .docker.image }}:{{ .tagversion }}
        imagePullPolicy: {{ if .docker.registry }}Always{{ else }}Never{{ end }}
        securityContext:
          runAsNonRoot: true
          runAsUser: 999
          allowPrivilegeEscalation: false
        ports:
        - containerPort: {{ .servicePort }}
          name: http
        env:
        - name: COMPROMISED_MODE
          value: {{ .compromisedMode | quote }}
        - name: MCP_SERVER_URL
          value: {{ .mcpServerUrl | quote }}
        - name: OPENAI_API_BASE
          valueFrom:
            secretKeyRef:
              name: banking-llm-credentials
              key: api-base-url
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: banking-llm-credentials
              key: api-key
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
{{- end }}
