<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="shd" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="hl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="50" cy="50" r="48" fill="url(#bg)" stroke="#0d9488" stroke-width="2"/>

  <!-- Shield body -->
  <path d="M50 13 L76 25 L76 51 Q69 72 50 84 Q31 72 24 51 L24 25 Z"
        fill="url(#shd)"/>

  <!-- Shield highlight -->
  <path d="M50 13 L76 25 L76 51 Q69 72 50 84 Q31 72 24 51 L24 25 Z"
        fill="url(#hl)"/>

  <!-- Shield border -->
  <path d="M50 13 L76 25 L76 51 Q69 72 50 84 Q31 72 24 51 L24 25 Z"
        stroke="#2dd4bf" stroke-width="1.5" fill="none"/>

  <!-- Connection lines (drawn before nodes so nodes sit on top) -->
  <line x1="50" y1="40" x2="37" y2="29" stroke="#99f6e4" stroke-width="1.2" opacity="0.8"/>
  <line x1="50" y1="40" x2="63" y2="29" stroke="#99f6e4" stroke-width="1.2" opacity="0.8"/>
  <line x1="50" y1="40" x2="50" y2="59" stroke="#99f6e4" stroke-width="1.2" opacity="0.8"/>
  <line x1="37" y1="29" x2="63" y2="29" stroke="#99f6e4" stroke-width="0.8" opacity="0.45"/>

  <!-- Central node (orchestrator) -->
  <circle cx="50" cy="40" r="4.5" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>

  <!-- Left node (agent) -->
  <circle cx="37" cy="29" r="3.2" fill="#ccfbf1" stroke="#5eead4" stroke-width="1.2"/>

  <!-- Right node (MCP server) -->
  <circle cx="63" cy="29" r="3.2" fill="#ccfbf1" stroke="#5eead4" stroke-width="1.2"/>

  <!-- Bottom node (client) -->
  <circle cx="50" cy="59" r="3.2" fill="#ccfbf1" stroke="#5eead4" stroke-width="1.2"/>

  <!-- CASA text -->
  <text x="50" y="72"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,sans-serif"
        font-weight="800" font-size="7.5" fill="#2dd4bf"
        text-anchor="middle" letter-spacing="1.5">CASA</text>
</svg>
