---
name: Build & Push (GHCR)

on:
  workflow_call:
    inputs:
      image-name:
        description: Image name under GHCR (can include slashes)
        required: true
        type: string
      context:
        description: Docker build context
        required: false
        type: string
        default: "."
      dockerfile:
        description: Path to Dockerfile (relative to repo root)
        required: false
        type: string
        default: "Dockerfile"
      image-tag:
        description: Optional explicit tag (otherwise date-sha)
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${{ inputs.image-tag }}" ]]; then
            TAG="${{ inputs.image-tag }}"
          else
            DATE="$(date +'%Y-%m-%d')"
            SHA="$(git rev-parse --short HEAD)"
            TAG="$DATE-$SHA"
          fi

          IMAGE="ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          TAGS="$IMAGE:$TAG"
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            TAGS+=$'\n'"$IMAGE:latest"
          fi

          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Login to GHCR (GITHUB_TOKEN)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
