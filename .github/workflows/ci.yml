---
name: CASA Runtime CI/CD
on:
    push:
        branches:
            - main
            - update-doc
    workflow_dispatch:
    workflow_call:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    id-token: write # This is required for requesting the JWT
    contents: read # This is required for actions/checkout
    packages: write # needed to push docker image to ghcr

jobs:
    ################################## checkout & unit tests ######################
    ###############################################################################
    checkout:
        name: checkout & unit test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
              with:
                  # The branch, tag or SHA to checkout, otherwise, uses the default branch.
                  ref: ${{ github.ref }}
                  # Relative path under $GITHUB_WORKSPACE to place the repository
                  path: ""
                  # Whether to execute `git clean -ffdx && git reset --hard HEAD` before fetching
                  # Default: true
                  clean: true
                  token: ${{ github.token }}
                  # Whether to download Git-LFS files
                  # Default: false
                  lfs: ""
                  # Whether to checkout submodules: `true` to checkout submodules or `recursive` to
                  # recursively checkout submodules.
                  # Default: false
                  submodules: "recursive"

    ################################## Docker build & push ##########################
    #################################################################################
    call-docker-build-push-auth-service:
        name: Call Docker Build Auth Service
        needs: [checkout]
        uses: ./.github/workflows/build-push-ghcr.yaml

        with:
            image-name: "casa-auth-server"
            context: .
            dockerfile: deployments/docker/Dockerfile


    call-docker-build-push-ui-explorer:
        name: Call Docker Build UI Explorer
        needs: [checkout]
        uses: ./.github/workflows/build-push-ghcr.yaml

        with:
            image-name: "casa-auth-server-ui"
            context: .
            dockerfile: deployments/docker/Dockerfile.ui

    call-docker-build-push-keycloak:
        name: Call Docker Build Keycloak
        needs: [checkout]
        uses: ./.github/workflows/build-push-ghcr.yaml

        with:
            image-name: "casa-auth-server-keycloak"
            context: deployments/docker
            dockerfile: deployments/docker/Dockerfile.keycloak

    call-docker-build-push-operator:
        name: Call Docker Build CASA Operator
        needs: [checkout]
        uses: ./.github/workflows/build-push-ghcr.yaml
        with:
            image-name: "outshift-casa/casa-operator"
            context: .
            dockerfile: deployments/docker/Dockerfile.operator

    call-docker-build-push-wasm:
        name: Call Docker Build traceparent injector WASM plugin
        needs: [checkout]
        uses: ./.github/workflows/build-push-ghcr.yaml
        with:
            image-name: "outshift-casa/traceparent_injector_plugin"
            context: sidecar/traceparent_injector
            dockerfile: sidecar/traceparent_injector/Dockerfile

    call-docker-build-push-llm-proxy-wasm:
        name: Call Docker Build LLM proxy WASM plugin
        needs: [checkout]
        uses: ./.github/workflows/build-push-ghcr.yaml
        with:
            image-name: "outshift-casa/llm_proxy_plugin"
            context: sidecar/llm_proxy
            dockerfile: sidecar/llm_proxy/Dockerfile

    call-docker-build-push-ext-auth-service:
        name: Call Docker Build ext-auth service
        needs: [checkout]
        uses: ./.github/workflows/build-push-ghcr.yaml
        with:
            image-name: "outshift-casa/ext_auth_service"
            context: .
            dockerfile: deployments/docker/Dockerfile.extauth

    ################################## Helm Publish (OCI to GHCR) #####################
    ###################################################################################
    call-helm-publish-casa-runtime:
        name: Helm publish casa-runtime (OCI GHCR)
        needs:
            [
                checkout,
                call-docker-build-push-auth-service,
                call-docker-build-push-ui-explorer,
                call-docker-build-push-keycloak,
                call-docker-build-push-operator,
            ]
        uses: ./.github/workflows/helm-publish.yaml
        with:
            chart-path: deployments/helm/casa-runtime
            oci-repository: helm

    call-helm-publish-sidecar:
        name: Helm publish sidecar (OCI GHCR)
        needs:
            [
                checkout,
                call-docker-build-push-wasm,
                call-docker-build-push-llm-proxy-wasm,
                call-docker-build-push-ext-auth-service,
            ]
        uses: ./.github/workflows/helm-publish.yaml
        with:
            chart-path: deployments/helm/sidecar
            oci-repository: helm

    ################################## Demo images (temporary — remove after PR) ####
    ###################################################################################
    call-docker-build-push-demo-agent-safe:
        name: Call Docker Build Demo Agent Safe
        needs: [checkout]
        uses: ./.github/workflows/build-push-ghcr.yaml
        with:
            image-name: "outshift-casa/demo/agent-safe"
            context: demo/src/agent-safe
            dockerfile: demo/src/agent-safe/Dockerfile

    call-docker-build-push-demo-agent-compromised:
        name: Call Docker Build Demo Agent Compromised
        needs: [checkout]
        uses: ./.github/workflows/build-push-ghcr.yaml
        with:
            image-name: "outshift-casa/demo/agent-compromised"
            context: demo/src/agent-compromised
            dockerfile: demo/src/agent-compromised/Dockerfile

    call-docker-build-push-demo-mcp:
        name: Call Docker Build Demo MCP Server
        needs: [checkout]
        uses: ./.github/workflows/build-push-ghcr.yaml
        with:
            image-name: "outshift-casa/demo/mcp"
            context: demo/src/mcp
            dockerfile: demo/src/mcp/Dockerfile

    call-docker-build-push-demo-chat-ui:
        name: Call Docker Build Demo Chat UI
        needs: [checkout]
        uses: ./.github/workflows/build-push-ghcr.yaml
        with:
            image-name: "outshift-casa/demo/chat-ui"
            context: demo/src/chat-ui
            dockerfile: demo/src/chat-ui/Dockerfile

    call-helm-publish-demo:
        name: Helm publish casa-demo (OCI GHCR)
        needs:
            [
                checkout,
                call-docker-build-push-demo-agent-safe,
                call-docker-build-push-demo-agent-compromised,
                call-docker-build-push-demo-mcp,
                call-docker-build-push-demo-chat-ui,
            ]
        uses: ./.github/workflows/helm-publish.yaml
        with:
            chart-path: demo/helm
            oci-repository: helm
