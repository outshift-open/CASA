openapi: 3.1.0
info:
  title: FastAPI
  version: 0.1.0
servers:
- url: /
paths:
  /health:
    get:
      description: Health check endpoint.
      operationId: health_check_health_get
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                title: Response Health Check Health Get
          description: Successful Response
      summary: Health Check
      tags:
      - Authorization Server
  /{app_id}/oauth2/client-metadata.json:
    get:
      description: Get an Application client metadata.
      operationId: app_metadata
      parameters:
      - explode: false
        in: path
        name: app_id
        required: true
        schema:
          title: App Id
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppMetadataResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: App Metadata
      tags:
      - Authorization Server
  /{app_id}/oauth2/token:
    post:
      description: Generate a new token based on the request parameters.
      operationId: token
      parameters:
      - explode: false
        in: path
        name: app_id
        required: true
        schema:
          title: App Id
          type: string
        style: simple
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/TokenRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Token
      tags:
      - Authorization Server
  /{app_id}/oauth2/token_exchange:
    post:
      description: Do a token exchange for an app.
      operationId: token_exchange
      parameters:
      - explode: false
        in: path
        name: app_id
        required: true
        schema:
          title: App Id
          type: string
        style: simple
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/TokenExchangeRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Token Exchange
      tags:
      - Authorization Server
  /oauth2/introspect:
    post:
      description: Introspect a token and evaluate it against the requested tools.
      operationId: introspect
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/Body_introspect"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenIntrospectResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Introspect
      tags:
      - Authorization Server
  /apps:
    get:
      description: Get all Apps.
      operationId: get_apps_apps_get
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/AppViewModel"
                title: Response Get Apps Apps Get
                type: array
          description: Successful Response
      summary: Get Apps
      tags:
      - Apps
    post:
      description: Create a new App.
      operationId: create_app_apps_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppViewModel"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Create App
      tags:
      - Apps
  /apps/{app_id}:
    delete:
      description: Delete an App.
      operationId: delete_app_apps__app_id__delete
      parameters:
      - explode: false
        in: path
        name: app_id
        required: true
        schema:
          title: App Id
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                title: Response Delete App Apps  App Id  Delete
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Delete App
      tags:
      - Apps
    get:
      description: Get an App by ID.
      operationId: get_app_apps__app_id__get
      parameters:
      - explode: false
        in: path
        name: app_id
        required: true
        schema:
          title: App Id
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppViewModel"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Get App
      tags:
      - Apps
    put:
      description: Update an existing App.
      operationId: update_app_apps__app_id__put
      parameters:
      - explode: false
        in: path
        name: app_id
        required: true
        schema:
          title: App Id
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppViewModel"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Update App
      tags:
      - Apps
  /trace/llm/call_start:
    post:
      description: Record the start of an LLM call for the authenticated agent.
      operationId: trace_llm_call_start
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LLMCallStartedRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LLMCallStartedEvent"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Trace Llm Call Start
      tags:
      - Traces
  /trace/llm/call_end:
    post:
      description: Record the end of an LLM call for the authenticated agent.
      operationId: trace_llm_call_end
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LLMCallEndedRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LLMCallEndedEvent"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Trace Llm Call End
      tags:
      - Traces
  /trace:
    get:
      description: Retrieve paginated traces for all source app calls.
      operationId: get_traces_trace_get
      parameters:
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          title: Page
          type: integer
        style: form
      - explode: true
        in: query
        name: page_size
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          title: Page Size
          type: integer
        style: form
      - explode: true
        in: query
        name: mas_id
        required: false
        schema:
          format: uuid
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: all
        required: false
        schema:
          default: false
          title: All
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Get Traces
      tags:
      - Traces
  /mas:
    get:
      description: Get the list of all multi agent systems.
      operationId: get_all_mas_mas_get
      responses:
