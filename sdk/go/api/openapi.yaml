          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Update Mas
      tags:
      - Multi Agent Systems
  /mas/{mas_id}/apps:
    get:
      description: Get all the apps related to a MAS.
      operationId: get_mas_apps_mas__mas_id__apps_get
      parameters:
      - explode: false
        in: path
        name: mas_id
