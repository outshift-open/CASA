openapi: 3.1.0
info:
  title: FastAPI
  version: 0.1.0
servers:
- url: /
paths:
  /health:
    get:
      description: Health check endpoint.
      operationId: health_check_health_get
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                title: Response Health Check Health Get
          description: Successful Response
      summary: Health Check
      tags:
      - Authorization Server
  /{app_id}/oauth2/client-metadata.json:
    get:
      description: Get an Application client metadata.
      operationId: app_metadata
      parameters:
      - explode: false
        in: path
        name: app_id
        required: true
        schema:
          title: App Id
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppMetadataResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: App Metadata
      tags:
      - Authorization Server
  /{app_id}/oauth2/token:
    post:
      description: Generate a new token based on the request parameters.
      operationId: token
      parameters:
      - explode: false
        in: path
        name: app_id
        required: true
        schema:
          title: App Id
          type: string
        style: simple
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/TokenRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Token
      tags:
      - Authorization Server
  /{app_id}/oauth2/token_exchange:
    post:
      description: Do a token exchange for an app.
      operationId: token_exchange
      parameters:
      - explode: false
        in: path
        name: app_id
        required: true
        schema:
          title: App Id
          type: string
        style: simple
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/TokenExchangeRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Token Exchange
      tags:
      - Authorization Server
  /oauth2/introspect:
    post:
      description: Introspect a token and evaluate it against the requested tools.
      operationId: introspect
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/Body_introspect"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenIntrospectResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Introspect
      tags:
      - Authorization Server
  /apps:
    get:
      description: Get all Apps.
      operationId: get_apps_apps_get
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/AppViewModel"
                title: Response Get Apps Apps Get
                type: array
                default: null
          description: Successful Response
      summary: Get Apps
      tags:
      - Apps
    post:
      description: Create a new App.
      operationId: create_app_apps_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppViewModel"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Create App
      tags:
      - Apps
  /apps/{app_id}:
    delete:
      description: Delete an App.
      operationId: delete_app_apps__app_id__delete
      parameters:
      - explode: false
        in: path
        name: app_id
        required: true
        schema:
          title: App Id
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                title: Response Delete App Apps  App Id  Delete
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Delete App
      tags:
      - Apps
    get:
      description: Get an App by ID.
      operationId: get_app_apps__app_id__get
      parameters:
      - explode: false
        in: path
        name: app_id
        required: true
        schema:
          title: App Id
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppViewModel"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Get App
      tags:
      - Apps
    put:
      description: Update an existing App.
      operationId: update_app_apps__app_id__put
      parameters:
      - explode: false
        in: path
        name: app_id
        required: true
        schema:
          title: App Id
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppViewModel"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Update App
      tags:
      - Apps
  /trace/llm/call_start:
    post:
      description: Record the start of an LLM call for the authenticated agent.
      operationId: trace_llm_call_start
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LLMCallStartedRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LLMCallStartedEvent"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Trace Llm Call Start
      tags:
      - Traces
  /trace/llm/call_end:
    post:
      description: Record the end of an LLM call for the authenticated agent.
      operationId: trace_llm_call_end
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LLMCallEndedRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LLMCallEndedEvent"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Trace Llm Call End
      tags:
      - Traces
  /trace/session/{user_input_id}:
    get:
      description: Retrieve all traces for a single session ordered by creation time.
      operationId: get_session
      parameters:
      - explode: false
        in: path
        name: user_input_id
        required: true
        schema:
          format: uuid
          title: User Input Id
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Get Session
      tags:
      - Traces
  /trace:
    get:
      description: "Retrieve paginated traces, optionally filtered by session, blocked\
        \ status, tool name, event type, or blocking type."
      operationId: get_traces_trace_get
      parameters:
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          title: Page
          type: integer
        style: form
      - explode: true
        in: query
        name: page_size
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          title: Page Size
          type: integer
        style: form
      - explode: true
        in: query
        name: mas_id
        required: false
        schema:
          format: uuid
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: all
        required: false
        schema:
          default: false
          title: All
          type: boolean
        style: form
      - explode: true
        in: query
        name: sort_asc
        required: false
        schema:
          default: false
          title: Sort Asc
          type: boolean
        style: form
      - explode: true
        in: query
        name: user_input_id
        required: false
        schema:
          format: uuid
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: blocked
        required: false
        schema:
          nullable: true
          type: boolean
        style: form
      - explode: true
        in: query
        name: q
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: event_type
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: blocking_type
        required: false
        schema:
          nullable: true
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Get Traces
      tags:
      - Traces
  /mas:
    get:
      description: "Get a paginated list of multi agent systems, with inline app summaries\
        \ and optional trace counts."
      operationId: get_all_mas_mas_get
      parameters:
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          title: Page
          type: integer
        style: form
      - explode: true
        in: query
        name: page_size
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          title: Page Size
          type: integer
        style: form
      - explode: true
        in: query
        name: q
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: include_metrics
        required: false
        schema:
          default: false
          title: Include Metrics
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MASListResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Get All Mas
      tags:
      - Multi Agent Systems
    put:
      description: Create a new multi agent system.
      operationId: create_mas_mas_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MultiAgentSystemCreateRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MultiAgentSystem"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Create Mas
      tags:
      - Multi Agent Systems
  /mas/{mas_id}/bind_apps:
    post:
      description: Bind a list of apps with an existing multi agent system.
      operationId: bind_apps_mas__mas_id__bind_apps_post
      parameters:
      - explode: false
        in: path
        name: mas_id
        required: true
        schema:
          title: Mas Id
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MultiAgentSystemAppsBindingRequest"
        required: true
      responses:
        "204":
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Bind Apps
      tags:
      - Multi Agent Systems
  /mas/{mas_id}:
    delete:
      description: Delete an existing multi agent system.
      operationId: delete_mas_mas__mas_id__delete
      parameters:
      - explode: false
        in: path
        name: mas_id
        required: true
        schema:
          title: Mas Id
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Delete Mas
      tags:
      - Multi Agent Systems
    get:
      description: Get a multi agent system by id.
      operationId: get_mas_by_id_mas__mas_id__get
      parameters:
      - explode: false
        in: path
        name: mas_id
        required: true
        schema:
          title: Mas Id
          type: string
        style: simple
      - explode: true
        in: query
        name: include_metrics
        required: false
        schema:
          default: false
          title: Include Metrics
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MASViewModel"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Get Mas By Id
      tags:
      - Multi Agent Systems
    post:
      description: Update an existing multi agent system instance.
      operationId: update_mas_mas__mas_id__post
      parameters:
      - explode: false
        in: path
        name: mas_id
        required: true
        schema:
          title: Mas Id
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MultiAgentSystemUpdateRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MultiAgentSystem"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Update Mas
      tags:
      - Multi Agent Systems
  /mas/{mas_id}/apps:
    get:
      description: Get all the apps related to a MAS.
      operationId: get_mas_apps_mas__mas_id__apps_get
      parameters:
      - explode: false
        in: path
        name: mas_id
        required: true
        schema:
          title: Mas Id
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/AppViewModel"
                title: Response Get Mas Apps Mas  Mas Id  Apps Get
                type: array
                default: null
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Get Mas Apps
      tags:
      - Multi Agent Systems
  /metrics:
    get:
      description: Return a pre-aggregated metrics snapshot.
      operationId: get_metrics_metrics_get
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsSnapshot"
          description: Successful Response
      summary: Get Metrics
      tags:
      - Metrics
  /scopes:
    get:
      description: Get all scopes.
      operationId: get_scopes_scopes_get
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/ScopeViewModel"
                title: Response Get Scopes Scopes Get
                type: array
                default: null
          description: Successful Response
      summary: Get Scopes
      tags:
      - Scopes
    post:
      description: Create a new scope.
      operationId: create_scope_scopes_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScopeCreateRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopeViewModel"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Create Scope
      tags:
      - Scopes
  /scopes/{scope_id}:
    delete:
      description: Delete a scope.
      operationId: delete_scope_scopes__scope_id__delete
      parameters:
      - explode: false
        in: path
        name: scope_id
        required: true
        schema:
          title: Scope Id
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                title: Response Delete Scope Scopes  Scope Id  Delete
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Delete Scope
      tags:
      - Scopes
    get:
      description: Get a scope by ID.
      operationId: get_scope_scopes__scope_id__get
      parameters:
      - explode: false
        in: path
        name: scope_id
        required: true
        schema:
          title: Scope Id
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopeViewModel"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Get Scope
      tags:
      - Scopes
    put:
      description: Update an existing scope.
      operationId: update_scope_scopes__scope_id__put
      parameters:
      - explode: false
        in: path
        name: scope_id
        required: true
        schema:
          title: Scope Id
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScopeUpdateRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopeViewModel"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Update Scope
      tags:
      - Scopes
  /k8s/namespaces/{namespace}/mas:
    post:
      description: |-
        Create a new MultiAgentSystem CRD.

        This endpoint is used by kubectl or Kubernetes operators to create a new
        Multi-Agent System through the CRD API.
      operationId: create_mas_crd
      parameters:
      - explode: false
        in: path
        name: namespace
        required: true
        schema:
          title: Namespace
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MASCreateRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MultiAgentSystemCRD"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Create Mas Crd
      tags:
      - Kubernetes CRDs
  /k8s/namespaces/{namespace}/mas/{name}:
    delete:
      description: Delete a MultiAgentSystem CRD.
      operationId: delete_mas_crd
      parameters:
      - explode: false
        in: path
        name: namespace
        required: true
        schema:
          title: Namespace
          type: string
        style: simple
      - explode: false
        in: path
        name: name
        required: true
        schema:
          title: Name
          type: string
        style: simple
      responses:
        "204":
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Delete Mas Crd
      tags:
      - Kubernetes CRDs
  /k8s/namespaces/{namespace}/policies:
    post:
      description: |-
        Create or update a CASAPolicy CRD.

        This endpoint is used by the Kubernetes operator to register a CASAPolicy
        with the CASA runtime. It is idempotent.
      operationId: create_policy_crd
      parameters:
      - explode: false
        in: path
        name: namespace
        required: true
        schema:
          title: Namespace
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CASAPolicyCreateRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CASAPolicyCRD"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Create Policy Crd
      tags:
      - Kubernetes CRDs
  /k8s/namespaces/{namespace}/policies/{name}:
    delete:
      description: Delete a CASAPolicy CRD.
      operationId: delete_policy_crd
      parameters:
      - explode: false
        in: path
        name: namespace
        required: true
        schema:
          title: Namespace
          type: string
        style: simple
      - explode: false
        in: path
        name: name
        required: true
        schema:
          title: Name
          type: string
        style: simple
      responses:
        "204":
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Delete Policy Crd
      tags:
      - Kubernetes CRDs
  /user-inputs:
    post:
      description: Create a new User Input.
      operationId: create_user_input
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserInputRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInput"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Create User Input
      tags:
      - UserInputs
  /user_inputs/get_by_tag/{tag}:
    get:
      description: Get a UserInput by tag.
      operationId: get_user_input_by_tag
      parameters:
      - explode: false
        in: path
        name: tag
        required: true
        schema:
          title: Tag
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInput"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Get User Input By Tag
      tags:
      - UserInputs
  /k8s/namespaces/{namespace}/get_mas_by_app_host:
    get:
      operationId: get_k8s_mas_by_app_host
      parameters:
      - explode: false
        in: path
        name: namespace
        required: true
        schema:
          title: Namespace
          type: string
        style: simple
      - explode: true
        in: query
        name: app_host
        required: true
        schema:
          title: App Host
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
