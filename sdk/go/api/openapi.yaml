      description: Bind a list of apps with an existing multi agent system.
      operationId: bind_apps_mas__mas_id__bind_apps_post
      parameters:
      - explode: false
        in: path
        name: mas_id
        required: true
        schema:
          title: Mas Id
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
