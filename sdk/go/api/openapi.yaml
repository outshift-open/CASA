  /k8s/namespaces/{namespace}/mas:
    post:
      description: |-
        Create a new MultiAgentSystem CRD.

        This endpoint is used by kubectl or Kubernetes operators to create a new
        Multi-Agent System through the CRD API.
      operationId: create_mas_crd
      parameters:
      - explode: false
        in: path
        name: namespace
        required: true
