components:
  schemas:
    ActorClaim:
      description: |-
        Pydantic model for the JWT 'act' (actor) claim.

        Represents an actor in a delegation chain. Can be nested to represent
        a chain of delegation where the outermost act claim represents the
        current actor and nested act claims represent prior actors.

        As per RFC 8693, for access control decisions, only the top-level
        claims and the current actor (outermost act claim) should be considered.
      properties:
        sub:
          title: Sub
          type: string
        act:
          allOf:
          - $ref: "#/components/schemas/ActorClaim"
          nullable: true
      required:
      - sub
      title: ActorClaim
    AppCredentials:
      description: OAuth2 credentials for an application.
      properties:
        appName:
          description: Name of the application
          title: Appname
          type: string
        appId:
          description: Application UUID
          title: Appid
          type: string
        clientId:
          description: OAuth2 client ID
          title: Clientid
          type: string
        clientSecret:
          description: OAuth2 client secret
          title: Clientsecret
          type: string
        secretName:
          description: Name of the K8s secret to create
          title: Secretname
          type: string
      required:
      - appId
      - appName
      - clientId
      - clientSecret
      - secretName
      title: AppCredentials
    AppMetadataResponse:
      description: Pydantic model for app metadata response.
      example:
