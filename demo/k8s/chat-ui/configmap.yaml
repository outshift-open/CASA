apiVersion: v1
kind: ConfigMap
metadata:
  name: chat-ui-nginx
  namespace: zta-control-plane-dev
  labels:
    app: chat-ui
    component: demo
data:
  default.conf: |
    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Use kube-dns for upstream resolution — required so nginx defers DNS
        # lookup to request time instead of startup, allowing the pod to start
        # even when the agent services don't exist yet.
        resolver kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off;

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Serve static assets with cache
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Proxy /safe-agent/ → safe demo agent
        # Variable assignment defers DNS resolution to request time (requires resolver above)
        location /safe-agent/ {
            set $safe_agent http://demo-agent-safe:8082;
            proxy_pass $safe_agent/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy /compromised-agent/ → compromised demo agent
        location /compromised-agent/ {
            set $compromised_agent http://demo-agent-compromised:8082;
            proxy_pass $compromised_agent/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }

        error_page 404 /index.html;
    }
