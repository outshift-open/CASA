apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chat-ui
  namespace: default
  labels:
    app: chat-ui
    component: demo
spec:
  ingressClassName: nginx
  rules:
  - host: chat.local
    http:
      paths:
      - backend:
          service:
            name: chat-ui
            port:
              number: 80
        path: /
        pathType: Prefix
