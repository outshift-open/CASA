apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.mcp.serviceName }}
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: {{ .Values.mcp.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.mcp.serviceName }}
  template:
    metadata:
      labels:
        app: {{ .Values.mcp.serviceName }}
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
      - name: {{ .Values.mcp.serviceName }}
        image: {{ .Values.mcp.docker.registry }}/{{ .Values.mcp.docker.image }}:{{ .Values.mcp.tagversion }}
        imagePullPolicy: Always
        securityContext:
          runAsNonRoot: true
          runAsUser: 999
          allowPrivilegeEscalation: false
        ports:
        - containerPort: {{ .Values.mcp.servicePort }}
