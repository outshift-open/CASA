apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-chat-ui
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-chat-ui
    component: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-chat-ui
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-chat-ui
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: chat-ui
          image: {{ .Values.chatUi.docker.registry }}/{{ .Values.chatUi.docker.image }}:{{ .Values.chatUi.tagversion }}
          imagePullPolicy: Always
          env:
            - name: AGENT_URL
              value: {{ .Values.chatUi.agentUrl | quote }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
      volumes:
        - name: nginx-config
          configMap:
            name: {{ .Release.Name }}-chat-ui-nginx
