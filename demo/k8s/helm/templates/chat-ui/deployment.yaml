{{- $root := . }}
{{- range .Values.chatUis }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $root.Release.Name }}-chat-ui-{{ .name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    app: {{ $root.Release.Name }}-chat-ui-{{ .name }}
    component: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $root.Release.Name }}-chat-ui-{{ .name }}
  template:
    metadata:
      labels:
        app: {{ $root.Release.Name }}-chat-ui-{{ .name }}
        sidecar.istio.io/inject: "false"
    spec:
      {{- if .docker.registry }}
      imagePullSecrets:
        - name: regcred
      {{- end }}
      containers:
        - name: chat-ui
          image: {{ if .docker.registry }}{{ .docker.registry }}/{{ end }}{{ .docker.image }}:{{ .tagversion }}
          imagePullPolicy: {{ if .docker.registry }}Always{{ else }}Never{{ end }}
          env:
            - name: AGENT_URL
              value: {{ .agentUrl | quote }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
      volumes:
        - name: nginx-config
          configMap:
            name: {{ $root.Release.Name }}-chat-ui-nginx
{{- end }}
