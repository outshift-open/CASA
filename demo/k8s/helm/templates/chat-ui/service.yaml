apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-chat-ui
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-chat-ui
    component: demo
spec:
  type: ClusterIP
  selector:
    app: {{ .Release.Name }}-chat-ui
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
