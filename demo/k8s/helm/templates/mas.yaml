apiVersion: zta.io/v1alpha1
kind: MultiAgentSystem
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  name: {{ .Values.mas.name }}
  enabledToolChecks: {{ toYaml .Values.mas.enabledToolChecks | nindent 4 }}
  apps:
    - name: {{ .Values.agentSafe.serviceName }}
      type: agent
      baseUrl: http://{{ .Values.agentSafe.serviceName }}:{{ .Values.agentSafe.servicePort }}
    - name: {{ .Values.agentCompromised.serviceName }}
      type: agent
      baseUrl: http://{{ .Values.agentCompromised.serviceName }}:{{ .Values.agentCompromised.servicePort }}
    - name: {{ .Values.mcp.serviceName }}
      type: mcp_server
      baseUrl: http://{{ .Values.mcp.serviceName }}:{{ .Values.mcp.servicePort }}
