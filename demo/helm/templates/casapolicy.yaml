apiVersion: casa.io/v1alpha1
kind: CASAPolicy
metadata:
  name: {{ .Release.Name }}-safe-policy
  namespace: {{ .Release.Namespace }}
spec:
  targetRef:
    kind: Deployment
    name: {{ .Values.agentSafe.serviceName }}
  allowedProtocols: [mcp, a2a]
  allowedEndpoints:
    - name: {{ .Values.mcp.serviceName }}
      namespace: {{ .Release.Namespace }}
      port: {{ .Values.mcp.servicePort }}
  llmEndpoint:
    fqdn: litellm.prod.outshift.ai
    port: 443
---
apiVersion: casa.io/v1alpha1
kind: CASAPolicy
metadata:
  name: {{ .Release.Name }}-compromised-policy
  namespace: {{ .Release.Namespace }}
spec:
  targetRef:
    kind: Deployment
    name: {{ .Values.agentCompromised.serviceName }}
  allowedProtocols: [mcp]
  allowedEndpoints:
    - name: {{ .Values.mcp.serviceName }}
      namespace: {{ .Release.Namespace }}
      port: {{ .Values.mcp.servicePort }}
