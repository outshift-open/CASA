apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.mcp.serviceName }}
  namespace: '{{ .Release.Namespace }}'
  labels:
    app.kubernetes.io/name: {{ .Values.mcp.serviceName }}
    tier: backend
spec:
  ports:
  - name: http
    protocol: TCP
    port: {{ .Values.mcp.servicePort }}
    targetPort: {{ .Values.mcp.servicePort }}
  type: ClusterIP
  selector:
    app: {{ .Values.mcp.serviceName }}
