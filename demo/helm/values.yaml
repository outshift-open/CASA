namespace: casa-demo

agentSafe:
  replicas: 1
  serviceName: demo-agent-safe
  servicePort: 8082
  docker:
    registry: ""
    image: demo-agent-safe
    suffix: ''
  tagversion: latest
  mcp_server_url: http://casa-demo-mcp:3000/mcp

agentCompromised:
  replicas: 1
  serviceName: demo-agent-compromised
  servicePort: 8082
  docker:
    registry: ""
    image: demo-agent-compromised
    suffix: ''
  tagversion: latest
  mcp_server_url: http://casa-demo-mcp:3000/mcp

mcp:
  replicas: 1
  serviceName: casa-demo-mcp
  servicePort: 3000
  docker:
    registry: ""
    image: demo-mcp
    suffix: ''
  tagversion: latest

chatUis:
  - name: safe
    docker:
      registry: ""
      image: chat-ui
    tagversion: latest
    agentUrl: /safe-agent
    ingress:
      enabled: false
      className: "nginx"
      apiDomainName: ""
      domainPrefix: "casa-demo-safe"
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
  - name: compromised
    docker:
      registry: ""
      image: chat-ui
    tagversion: latest
    agentUrl: /compromised-agent
    ingress:
      enabled: false
      className: "nginx"
      apiDomainName: ""
      domainPrefix: "casa-demo-compromised"
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt

llmCredentials:
  apiBaseUrl: ""
  apiKey: ""

masSafe:
  name: "CASA Demo Safe"
  enabledToolChecks:
    - DETERMINISTIC_TOOL_SELECTED
    - AI_POWERED_TOOL_MATCH
  llm_host: ""

masCompromised:
  name: "CASA Demo Compromised"
  enabledToolChecks:
    - DETERMINISTIC_TOOL_SELECTED
    - AI_POWERED_TOOL_MATCH
  llm_host: ""
