apiVersion: v1
kind: Service
metadata:
  name: {{ include "ext-authz-middleware.fullname" . }}
  labels:
    {{- include "ext-authz-middleware.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: 4003
      targetPort: grpc-inbound
      protocol: TCP
      name: grpc-inbound
    - port: 4005
      targetPort: grpc-outbound
      protocol: TCP
      name: grpc-outbound
    - port: 4000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "ext-authz-middleware.selectorLabels" . | nindent 4 }}
