apiVersion: v1
kind: Service
metadata:
  name: {{ include "ext-authz-middleware.fullname" . }}
  labels:
    {{- include "ext-authz-middleware.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: grpc
    - port: 4000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "ext-authz-middleware.selectorLabels" . | nindent 4 }}
