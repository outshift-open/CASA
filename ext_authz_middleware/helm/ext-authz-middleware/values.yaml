# ── OpenTelemetry Collector subchart ──────────────────────────────────────────
otelcollector:
  fullnameOverride: otel-collector-opentelemetry-collector
  mode: deployment
  podLabels:
    sidecar.istio.io/inject: "false"
  image:
    repository: "otel/opentelemetry-collector-k8s"
  config:
    exporters:
      otlp:
        endpoint: jaeger:4317
        tls:
          insecure: true
    extensions:
      health_check:
        endpoint: ${env:MY_POD_IP}:13133
    receivers:
      jaeger:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:14250
          thrift_http:
            endpoint: ${env:MY_POD_IP}:14268
          thrift_compact:
            endpoint: ${env:MY_POD_IP}:6831
      otlp:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:4317
          http:
            endpoint: ${env:MY_POD_IP}:4318
    service:
      extensions:
        - health_check
      pipelines:
        traces:
          exporters:
            - otlp
          processors:
            - batch
          receivers:
            - otlp
            - jaeger

# ── Jaeger subchart ────────────────────────────────────────────────────────────
jaeger:
  fullnameOverride: jaeger
  jaeger:
    podLabels:
      sidecar.istio.io/inject: "false"
    ingress:
      enabled: true
      ingressClassName: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
      hosts:
        - zta-jaeger.dev.outshift.ai
      pathType: Prefix
      tls:
        - hosts:
            - zta-jaeger.dev.outshift.ai
          secretName: jaeger-tls
  collector:
    enabled: true
    podLabels:
      sidecar.istio.io/inject: "false"
  query:
    enabled: true
    podLabels:
      sidecar.istio.io/inject: "false"
  agent:
    enabled: true
    podLabels:
      sidecar.istio.io/inject: "false"
  allInOne:
    enabled: false
  storage:
    type: memory
  ingester:
    enabled: false

# ── OBI (OpenTelemetry eBPF Instrumentation) subchart ─────────────────────────
obi:
  enabled: true
  podLabels:
    sidecar.istio.io/inject: "false"
  serviceAccount:
    name: "obi"
  privileged: true
  extraCapabilities:
    - NET_ADMIN
    - SYS_RESOURCE
    - SYS_ADMIN
  volumeMounts:
    - mountPath: /sys/kernel/security
      name: kernel-security
      readOnly: true
    - name: cgroup
      mountPath: /sys/fs/cgroup
  volumes:
    - name: kernel-security
      hostPath:
        path: /sys/kernel/security
        type: Directory
    - name: cgroup
      hostPath:
        path: /sys/fs/cgroup
  config:
    data:
      open_port: 8082
      routes:
        unmatched: heuristic
      ebpf:
        track_request_headers: true
      otel_traces_export:
        endpoint: "http://otel-collector-opentelemetry-collector:4317"
      otel_metrics_export:
        endpoint: "http://otel-collector-opentelemetry-collector:4318"
  env:
    OTEL_EBPF_BPF_CONTEXT_PROPAGATION: "all"
    OTEL_EBPF_LOG_LEVEL: debug
    OTEL_EBPF_NETWORK_CAPTURE_MODE: "tc"
