apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-ui-explorer-nginx
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "casa-control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui-explorer
data:
  default.conf: |
    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Serve static assets with cache
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        {{- if .Values.uiExplorer.nginx.apiProxyEnabled }}

        # API proxy — forwards /api/ to the auth-service.
        # Build the UI image with VITE_API_BASE_URL=/api to use this.
        location /api/ {
            proxy_pass {{ include "casa-control-plane.authServiceUrl" . }}/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        {{- end }}

        # React Router SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Error pages
        error_page 404 /index.html;
    }
