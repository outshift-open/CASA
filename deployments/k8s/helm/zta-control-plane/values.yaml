# ZTA Control Plane — default values
# Override these with --set or a custom values file.

# ─── Auth Service ────────────────────────────────────────────────────────────
authService:
  image:
    repository:
    tag:
    pullPolicy: IfNotPresent
  imagePullSecrets:
    - name: regcred
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  ingress:
    enabled: false
    className: ""
    apiDomainName: ""
    domainPrefix: "auth"
    annotations: {}
  env:
    # When empty, defaults to the in-cluster auth-service URL via _helpers.tpl
    authServerUrl: ""
  database:
    # When empty, defaults to the in-cluster postgres-auth service via _helpers.tpl
    host: ""
    port: 5432
    name: identity-platform
    username: postgres
    # Override in production — do NOT commit real passwords
    password: postgres
  idp:
    # When empty, defaults to the in-cluster Keycloak URL via _helpers.tpl
    serverUrl: ""
    adminUsername: admin
    # Override in production
    adminPassword: admin
  openai:
    apiBaseUrl:
    jwtToken:
    modelId:
    pipelineModelId:
  externalSecrets:
    enabled: false
    secretStoreName: ""
    secretStoreKind: ClusterSecretStore
    data: []
    # Example:
    # - secretKey: db-password
    #   remoteRef:
    #     key: dev/zta-control-plane
    #     property: db-password
    # - secretKey: idp-admin-password
    #   remoteRef:
    #     key: dev/zta-control-plane
    #     property: idp-admin-password
    # - secretKey: openai-api-base-url
    #   remoteRef:
    #     key: dev/zta-control-plane
    #     property: openai-api-base-url
    # - secretKey: openai-api-jwt-token
    #   remoteRef:
    #     key: dev/zta-control-plane
    #     property: openai-api-jwt-token

# ─── UI Explorer ─────────────────────────────────────────────────────────────
uiExplorer:
  image:
    repository:
    tag: 2026-04-14-7ce1d56
    pullPolicy: IfNotPresent
  imagePullSecrets:
    - name: regcred
  replicaCount: 1
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"
  ingress:
    enabled: false
    className: ""
    apiDomainName: ""
    domainPrefix: "zta"
    annotations: {}
  nginx:
    # When true, nginx proxies /api/ → auth-service (port 8000).
    # Build the UI image with VITE_API_BASE_URL=/api when this is enabled.
    # When false, the UI image must be built with the full auth-service URL.
    apiProxyEnabled: true

# ─── PostgreSQL (auth-service backend) ───────────────────────────────────────
postgresAuth:
  image:
    repository: postgres
    tag: "15-alpine"
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    size: 1Gi
    # Leave empty to use the cluster default StorageClass
    storageClass: ""
  database: identity-platform
  username: postgres
  # Override in production
  password: postgres
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "250m"

# ─── PostgreSQL (Keycloak backend) ───────────────────────────────────────────
postgresKeycloak:
  image:
    repository: postgres
    tag: "15-alpine"
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
  database: keycloak
  username: keycloak
  # Override in production
  password: keycloak
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

# ─── Keycloak ─────────────────────────────────────────────────────────────────
keycloak:
  image:
    # Custom image that includes the POIT HTTP-header protocol mapper JAR
    repository:
    tag: 2026-04-14-7ce1d56
    pullPolicy: IfNotPresent
  imagePullSecrets:
    - name: regcred
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      memory: "1Gi"
      cpu: "1"
    limits:
      memory: "2Gi"
      cpu: "2"
  admin:
    username: admin
    # Override in production
    password: admin
  ingress:
    enabled: false
    className: ""
    apiDomainName: ""
    domainPrefix: "keycloak"
    annotations: {}
  # KC_HOSTNAME — set to your actual hostname when deploying behind an ingress.
  # When keycloak.ingress.enabled is true this is auto-derived from
  # "<keycloak.ingress.domainPrefix>.<keycloak.ingress.apiDomainName>".
  hostname: localhost
  hostnamePort: 8080

# ─── Operator ────────────────────────────────────────────────────────────────
operator:
  image:
    repository:
    tag: 2026-04-14-7ce1d56
    pullPolicy: IfNotPresent
  imagePullSecrets:
    - name: regcred
  # When empty, defaults to in-cluster auth-service URL via _helpers.tpl
  authServiceUrl: ""
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"
