apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-postgres-auth-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zta-control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres-auth
type: Opaque
data:
  postgres-password: {{ .Values.postgresAuth.password | b64enc | quote }}
