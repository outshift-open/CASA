{{- if .Values.postgresKeycloak.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-postgres-keycloak-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zta-control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres-keycloak
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.postgresKeycloak.persistence.size }}
  {{- if .Values.postgresKeycloak.persistence.storageClass }}
  storageClassName: {{ .Values.postgresKeycloak.persistence.storageClass | quote }}
  {{- end }}
{{- end }}
