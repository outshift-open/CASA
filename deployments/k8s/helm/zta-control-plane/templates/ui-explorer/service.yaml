{{- $component := "ui-explorer" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ui-explorer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zta-control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  type: {{ .Values.uiExplorer.service.type }}
  selector:
    {{- include "zta-control-plane.selectorLabels" (dict "Release" .Release "Chart" .Chart "component" $component) | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.uiExplorer.service.port }}
      targetPort: http
