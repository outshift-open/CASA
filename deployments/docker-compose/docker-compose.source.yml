version: '3.8'

services:
  trusted-agent:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.source
    container_name: identity-trusted-agent
    ports:
      - "3999:3999"
    environment:
      - AUTH_SERVER_URL=http://host.docker.internal:8000
      - AGENT_CHAT_URL=http://host.docker.internal:8082/chat
      - TRUSTED_CLIENT_BASE_URL=http://localhost:3999
    restart: unless-stopped
