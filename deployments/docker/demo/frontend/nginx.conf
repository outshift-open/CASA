events {}
http {
    # Override temp file locations
    client_body_temp_path /home/web/nginx/tmp/client_body;
    proxy_temp_path /home/web/nginx/tmp/proxy;
    fastcgi_temp_path /home/web/nginx/tmp/fastcgi 1 2;
    uwsgi_temp_path /home/web/nginx/tmp/uwsgi;
    scgi_temp_path /home/web/nginx/tmp/scgi;
    error_log /dev/stderr;
    server_tokens off;

    server {
        include /etc/nginx/mime.types;

        access_log /dev/stdout;
        client_max_body_size 0;

        listen 5600;

        root /home/web/dist;
        index index.html index.htm;

        server_name localhost;

        gzip on;
        gzip_comp_level 5;
        gzip_min_length 1000;
        gzip_buffers 16 8k;
        gzip_proxied any;
        gzip_types
            text/plain
            text/css
            text/js
            text/xml
            text/javascript
            application/javascript
            application/json
            application/xml
            application/rss+xml
            image/svg+xml;

        charset utf-8;
        charset_types
            text/css
            text/plain
            text/javascript
            application/javascript
            application/json
            application/xml
            text/xml
            application/x-font-ttf
            application/x-font-opentype
            application/font-woff
            application/font-woff2
            image/svg+xml;

        # all assets contain hash in filename, cache forever
        location ^~ /assets/ {
            charset utf-8;
            add_header Cache-Control "public, max-age=31536000, s-maxage=31536000, immutable";
            try_files $uri =404;
        }

        location / {
            autoindex off;
            expires off;
            charset utf-8;
            add_header Cache-Control "public, max-age=0, s-maxage=0, must-revalidate" always;
            try_files $uri $uri/ /index.html;
            ssi on;
        }
    }
}