# CASA Control Plane — default values
# Override these with --set or a custom values file.

# ─── Auth Service ────────────────────────────────────────────────────────────
authService:
  image:
    repository: ghcr.io/outshift-open/outshift-casa/casa-auth-server
    tag: latest
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  ingress:
    enabled: false
    className: ""
    apiDomainName: ""
    domainPrefix: "auth"
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
      nginx.ingress.kubernetes.io/proxy-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
  env:
    # When empty, defaults to the in-cluster auth-service URL via _helpers.tpl
    authServerUrl: ""
  database:
    # When empty, defaults to the in-cluster postgres-auth service via _helpers.tpl
    host: ""
    port: 5432
    name: identity-platform
    username: postgres
    # Override in production — do NOT commit real passwords
    password: postgres
  idp:
    # When empty, defaults to the in-cluster Keycloak URL via _helpers.tpl
    serverUrl: ""
    adminUsername: admin
    # Override in production
    adminPassword: admin
  openai:
    modelId:
    llmApiBaseUrl:
    llmApiKey:
  externalSecrets:
    enabled: false
    secretStoreName: ""
    secretStoreKind: ClusterSecretStore
    data: []
    # Example:
    # - secretKey: db-password
    #   remoteRef:
    #     key: dev/casa-runtime
    #     property: db-password
    # - secretKey: idp-admin-password
    #   remoteRef:
    #     key: dev/casa-runtime
    #     property: idp-admin-password


# ─── UI Explorer ─────────────────────────────────────────────────────────────
uiExplorer:
  image:
    repository: ghcr.io/outshift-open/outshift-casa/casa-auth-server-ui
    tag: latest
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  replicaCount: 1
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"
  ingress:
    enabled: false
    className: ""
    apiDomainName: ""
    domainPrefix: "casa"
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
      nginx.ingress.kubernetes.io/proxy-buffer-size: "256k"
      nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
      nginx.ingress.kubernetes.io/proxy-body-size: "20m"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
  nginx:
    # When true, nginx proxies /api/ → auth-service (port 8000).
    # Build the UI image with VITE_API_BASE_URL=/api when this is enabled.
    # When false, the UI image must be built with the full auth-service URL.
    apiProxyEnabled: true

# ─── PostgreSQL (auth-service backend) ───────────────────────────────────────
postgresAuth:
  image:
    repository: postgres
    tag: "15-alpine"
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    size: 1Gi
    # Leave empty to use the cluster default StorageClass
    storageClass: ""
  database: identity-platform
  username: postgres
  # Override in production
  password: postgres
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "250m"

# ─── PostgreSQL (Keycloak backend) ───────────────────────────────────────────
postgresKeycloak:
  image:
    repository: postgres
    tag: "15-alpine"
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
  database: keycloak
  username: keycloak
  # Override in production
  password: keycloak
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

# ─── Keycloak ─────────────────────────────────────────────────────────────────
keycloak:
  image:
    # Custom image that includes the POIT HTTP-header protocol mapper JAR
    repository: ghcr.io/outshift-open/outshift-casa/casa-auth-server-keycloak
    tag: latest
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      memory: "1Gi"
      cpu: "1"
    limits:
      memory: "2Gi"
      cpu: "2"
  admin:
    username: admin
    # Override in production
    password: admin
  ingress:
    enabled: false
    className: ""
    apiDomainName: ""
    domainPrefix: "keycloak"
    annotations: {}
  # KC_HOSTNAME — set to your actual hostname when deploying behind an ingress.
  # When keycloak.ingress.enabled is true this is auto-derived from
  # "<keycloak.ingress.domainPrefix>.<keycloak.ingress.apiDomainName>".
  hostname: localhost
  hostnamePort: 8080

# ─── Operator ────────────────────────────────────────────────────────────────
operator:
  image:
    repository: ghcr.io/outshift-open/outshift-casa/casa-operator
    tag: latest
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  # When empty, defaults to in-cluster auth-service URL via _helpers.tpl
  authServiceUrl: ""
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"

# ─── Sidecar (ext-auth enforcement) ──────────────────────────────────────────
# Set enabled: true to deploy ext-auth, EnvoyFilter, and WasmPlugins alongside
# the control plane. Requires Istio. Set to false for plain Docker / Cilium
# deployments where enforcement is handled separately.
sidecar:
  enabled: true
  # When empty, authServerHost is auto-derived to:
  # "<release>-auth-service.<namespace>.svc.cluster.local"
  # Override when the auth-service is in a different release or namespace.
  authServerHost: ""
  authServerPort: "8000"
  authServerScheme: "http"
  replicaCount: 1
  image:
    repository: ghcr.io/outshift-open/outshift-casa/ext_auth_service
    tag: latest
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  podLabels:
    sidecar.istio.io/inject: "false"
  resources: {}
  llm_proxy:
    image:
      repository: ghcr.io/outshift-open/outshift-casa/llm_proxy_plugin
      tag: latest
      pullPolicy: IfNotPresent
      pullSecret: ""
  traceparent_injector:
    image:
      repository: ghcr.io/outshift-open/outshift-casa/traceparent_injector_plugin
      tag: latest
      pullPolicy: IfNotPresent
      pullSecret: ""
  otelcollector:
    fullnameOverride: otel-collector-opentelemetry-collector
    mode: deployment
    podLabels:
      sidecar.istio.io/inject: "false"
    image:
      repository: "otel/opentelemetry-collector-k8s"
    config:
      exporters:
        otlp:
          endpoint: jaeger:4317
          tls:
            insecure: true
      extensions:
        health_check:
          endpoint: ${env:MY_POD_IP}:13133
      receivers:
        jaeger:
          protocols:
            grpc:
              endpoint: ${env:MY_POD_IP}:14250
            thrift_http:
              endpoint: ${env:MY_POD_IP}:14268
            thrift_compact:
              endpoint: ${env:MY_POD_IP}:6831
        otlp:
          protocols:
            grpc:
              endpoint: ${env:MY_POD_IP}:4317
            http:
              endpoint: ${env:MY_POD_IP}:4318
      service:
        extensions:
          - health_check
        pipelines:
          traces:
            exporters:
              - otlp
            processors:
              - batch
            receivers:
              - otlp
              - jaeger
  jaeger:
    fullnameOverride: jaeger
    jaeger:
      podLabels:
        sidecar.istio.io/inject: "false"
      ingress:
        enabled: false
    collector:
      enabled: true
      podLabels:
        sidecar.istio.io/inject: "false"
    query:
      enabled: true
      podLabels:
        sidecar.istio.io/inject: "false"
    agent:
      enabled: true
      podLabels:
        sidecar.istio.io/inject: "false"
    allInOne:
      enabled: false
    storage:
      type: memory
    ingester:
      enabled: false
  opentelemetry-ebpf-instrumentation:
    podLabels:
      sidecar.istio.io/inject: "false"
    serviceAccount:
      name: "obi"
    image:
      repository: ghcr.io/open-telemetry/opentelemetry-ebpf-instrumentation/ebpf-instrument
      tag: main@sha256:0325b9d2a875f919f6f1f1cbeff0e9ce127e31670812e75347e13e008441274e
      pullPolicy: IfNotPresent
    privileged: true
    extraCapabilities:
      - NET_ADMIN
      - SYS_RESOURCE
      - SYS_ADMIN
    volumeMounts:
      - mountPath: /sys/kernel/security
        name: kernel-security
        readOnly: true
      - name: cgroup
        mountPath: /sys/fs/cgroup
      - mountPath: /sys/fs/bpf
        name: kernel-bpf
    volumes:
      - name: kernel-security
        hostPath:
          path: /sys/kernel/security
          type: Directory
      - name: cgroup
        hostPath:
          path: /sys/fs/cgroup
      - name: kernel-bpf
        hostPath:
          path: /sys/fs/bpf
          type: Directory
    config:
      data:
        discovery:
          instrument:
            - k8s_pod_name: "casa-demo-*"
            - k8s_pod_name: "demo-agent-*"
        routes:
          unmatched: heuristic
        attributes:
          kubernetes:
            enable: true
        network:
          enable: true
        ebpf:
          track_request_headers: true
          context_propagation: "all"
    env:
      OTEL_EBPF_BPF_CONTEXT_PROPAGATION: "all"
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      OTEL_EBPF_BPF_TRACK_REQUEST_HEADERS: "true"
      OTEL_EBPF_LOG_LEVEL: info
      OTEL_EBPF_METRICS_FEATURES: "application,application_span_otel,application_process,application_service_graph,ebpf,application_host"
      OTEL_EBPF_PROMETHEUS_FEATURES: "application,application_span_otel,application_process,application_service_graph,ebpf,application_host"
      OTEL_EBPF_BPF_DEBUG: "false"
      OTEL_EBPF_TRACE_PRINTER: "text"
      OTEL_EBPF_NAME_RESOLVER_SOURCES: "dns,k8s"
      OTEL_EBPF_KUBE_METADATA_ENABLE: "true"
