{{- if .Values.keycloak.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-keycloak
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "casa-runtime.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
  {{- if .Values.keycloak.ingress.annotations }}
  annotations:
    {{- range $key, $value := .Values.keycloak.ingress.annotations }}
    {{ $key }}: {{ tpl $value $ | quote }}
    {{- end }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.keycloak.ingress.className }}
  tls:
  - hosts:
    - "{{ .Values.keycloak.ingress.domainPrefix }}.{{ .Values.keycloak.ingress.apiDomainName }}"
    secretName: "{{ .Release.Name }}-keycloak-tls"
  rules:
  - host: "{{ .Values.keycloak.ingress.domainPrefix }}.{{ .Values.keycloak.ingress.apiDomainName }}"
    http:
      paths:
      - backend:
          service:
            name: {{ .Release.Name }}-keycloak
            port:
              number: {{ .Values.keycloak.service.port }}
        path: /
        pathType: Prefix
{{- end }}
