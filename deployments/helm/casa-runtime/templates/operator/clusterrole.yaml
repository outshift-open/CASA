apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-operator
  labels:
    {{- include "casa-runtime.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
rules:
  - apiGroups: ["casa.io"]
    resources: ["multiagentsystems"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["casa.io"]
    resources: ["multiagentsystems/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["casa.io"]
    resources: ["multiagentsystems/finalizers"]
    verbs: ["update"]
  - apiGroups: ["casa.io"]
    resources: ["casapolicies"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["casa.io"]
    resources: ["casapolicies/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["casa.io"]
    resources: ["casapolicies/finalizers"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.istio.io"]
    resources: ["serviceentries", "destinationrules", "sidecars"]
    verbs: ["get", "create", "update", "patch", "delete"]
