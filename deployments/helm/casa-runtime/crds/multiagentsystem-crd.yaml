apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: multiagentsystems.casa.io
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
    argocd.argoproj.io/sync-options: Prune=false
spec:
  group: casa.io
  names:
    kind: MultiAgentSystem
    plural: multiagentsystems
    singular: multiagentsystem
    shortNames:
    - mas
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - name
            properties:
              name:
                type: string
                description: "Human-readable name for the Multi-Agent System"
              enabledToolChecks:
                type: array
                description: "List of enabled tool authorization checks"
                items:
                  type: string
                  enum:
                  - DETERMINISTIC_TOOL_SELECTED
                  - DETERMINISTIC_LLM_SELECTED_TOOLS
                  - AI_POWERED_TOOL_MATCH
              llm_host:
                type: string
                description: "The host of the LLM endpoint used by the MAS"
              apps:
                type: array
                description: "List of applications in this Multi-Agent System"
                items:
                  type: object
                  required:
                  - name
                  - type
                  - baseUrl
                  - kubernetesWorkloadName
                  properties:
                    name:
                      type: string
                      description: "Unique name for the application"
                    type:
                      type: string
                      description: "Application type"
                      enum: [agent, mcp_server]
                    baseUrl:
                      type: object
                      description: "Base URL where the application is accessible"
                      required:
                      - host
                      - scheme
                      properties:
                        host:
                          type: string
                          description: "The host of the base URL"
                        scheme:
                          type: string
                          description: "The scheme of the base URL (http, https)"
                    kubernetesWorkloadName:
                      type: string
                      description: "Name of the Kubernetes workload (deployment, etc.) running the app."
                    httpRequestSchema:
                      type: object
                      required:
                      - promptFieldJsonPath
                      properties:
                        promptFieldJsonPath:
                          type: string
                          description: "A JSON path used to fetch the user prompt from the HTTP request body"
          status:
            type: object
            properties:
              phase:
                type: string
                description: "Current phase of the Multi-Agent System"
                enum: [Pending, Active, Failed]
              appsReady:
                type: integer
                description: "Number of apps successfully configured"
              lastSyncTime:
                type: string
                format: date-time
                description: "Timestamp of last successful reconciliation"
              message:
                type: string
                description: "Human-readable status message"
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: Apps Ready
      type: integer
      jsonPath: .status.appsReady
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
